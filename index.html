<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RFID Lead Tracker</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="boot" class="center-screen"><p class="muted">Loading…</p></div>

  <!-- Sign-in / status screens (filled by app.js) -->
  <div id="gate" class="center-screen" hidden></div>

  <!-- Main app -->
  <div id="app" hidden>
    <aside id="nav" aria-label="Main"></aside>
    <main id="view" tabindex="-1"></main>
  </div>

  <aside id="drawer" aria-label="Lead details" hidden></aside>
  <div id="scrim" hidden></div>

  <dialog id="dlg"></dialog>
  <dialog id="confirm"></dialog>
  <div id="colpop" class="colpop" hidden></div>

  <div id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
